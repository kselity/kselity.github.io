<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>kselity</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="kselity">

    <!-- Keywords -->
    <meta name="keywords" content="your name, industry, and specialties">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://kselity.com">

    <!-- Author Information -->
    <meta name="author" content="kselity">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <!-- <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink"> -->

            <!-- Replace with your name or brand -->
            <h1>
              <div>kselity</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <!--<p>An open source DIY Linktree alternative.</p>-->

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- SoundCloud -->
              <a class="button button-soundcloud" href="https://www.soundcloud.com/kselity" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/soundcloud.svg" alt="SoundCloud Logo">SoundCloud</a>

              <!-- Newgrounds -->
              <a class="button button-newgrounds" href="https://kselity.newgrounds.com/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/ng_logo.png" alt="Newgrounds icon">Newgrounds</a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/kselityy" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- TikTok -->
              <a class="button button-tiktok" href="https://www.tiktok.com/@kselity" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="TikTok Logo">TikTok</a>

              <!-- X -->
              <a class="button button-x" href="https://twitter.com/kselity" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/x.svg" alt="X Logo">Follow on X</a>

              <!-- YouTube -->
              <a class="button button-yt" href="https://youtube.com/@kselity" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="YouTube Logo">YouTube</a>

              <!-- Bluesky -->
              <a class="button button-bluesky" href="https://bsky.app/profile/kselity.com" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/bluesky.svg" alt="Bluesky Logo">Bluesky</a>

              
      </div>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        
      </footer>

    </div>
  </div>

</body>

</html>
